name: CI/CD — build, test, Docker push

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_BUCKET: ${{ secrets.VITE_SUPABASE_BUCKET }}

      - name: Smoke-test production server
        run: |
          (node server.cjs & echo $! > server.pid)
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/health | grep -q healthy
          curl -sf http://127.0.0.1:8080/ | grep -qi "<!doctype html"
          kill $(cat server.pid)
        env:
          PORT: 8080

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Build the image on PRs (no push); push only from main
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_BUCKET=${{ secrets.VITE_SUPABASE_BUCKET }}

  # Optional: auto-redeploy a free container host after the image pushes.
  # Add RENDER_DEPLOY_HOOK (or KOYEB_* secret) in GitHub Settings > Secrets,
  # otherwise this job is skipped.
  redeploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: secrets.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
