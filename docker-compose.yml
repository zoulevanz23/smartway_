services:
  app:
    build:
      context: .
      args:
        # Baked into the Vite bundle at build time — set in your shell/.env
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SUPABASE_BUCKET: ${VITE_SUPABASE_BUCKET:-uploads}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      NODE_ENV: production
      # ALLOWED_ORIGIN defaults to * in server.js; set to your domain in prod
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
